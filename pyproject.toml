[project]
name = "music-server"
version = "0.1.0"
description = "Async FastAPI backend for a music streaming application"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
	"sqlalchemy[asyncio]>=2.0,<3.0",
	"aiosqlite>=0.20,<1.0",
	"asyncpg>=0.29,<1.0",
	"pydantic-settings>=2.6,<3.0",
	"python-jose[cryptography]>=3.3,<4.0",
	"httpx>=0.27,<1.0",
	"yt-dlp>=2024.12.0",
	"python-multipart>=0.0.9,<1.0",
	"google>=3.0.0",
	"google-auth>=2.58.0",
	"requests>=2.34.2",
]

[project.scripts]
music-server = "app.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
